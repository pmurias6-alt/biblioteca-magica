<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca màgica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Kalam:wght@400;700&family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column; the same book markup becomes
   spines on a shelf (A), stops on a route (B) or cover cards (C). */
:root{
  --bg:#141a3a; --surface:#1e2650; --ink:#f2ecd8; --muted:#a9b0d6;
  --accent:#f2c14e; --accent-ink:#1b1930; --line:#34407a;
  --page:#f7f0dc; --page-ink:#23213a; --page-muted:#6b6780;
  --ok:#1f8a5b; --bad:#b8432f;
  --display:"Fraunces", Georgia, serif;
  --body:"Atkinson Hyperlegible", Verdana, sans-serif;
  --radius:14px; --border:1px solid var(--line); --shadow:0 6px 18px rgba(0,0,0,.28);
  --read-size:1.125rem;
  color-scheme:dark;
}
body[data-style="b"]{
  --bg:#efe6d0; --surface:#fffaf0; --ink:#1f3a5f; --muted:#5f7391;
  --accent:#d1495b; --accent-ink:#fff; --line:#b9c4d6;
  --page:#fffdf6; --page-ink:#1c2c44; --page-muted:#5f7391;
  --display:"Kalam", "Comic Sans MS", cursive;
  --radius:6px; --border:1.5px dashed var(--line); --shadow:none;
  color-scheme:light;
}
body[data-style="c"]{
  --bg:#f1eeff; --surface:#ffffff; --ink:#14121f; --muted:#55506b;
  --accent:#ff4f7b; --accent-ink:#14121f; --line:#14121f;
  --page:#ffffff; --page-ink:#14121f; --page-muted:#55506b;
  --display:"Bricolage Grotesque", "Arial Black", sans-serif;
  --radius:18px; --border:3px solid #14121f; --shadow:5px 5px 0 #14121f;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;padding:0 0 8px}
body[data-style="a"]{background:radial-gradient(circle at 20% 0,#27307a 0,#141a3a 55%)fixed}
body[data-style="b"]{background-image:linear-gradient(#d9cfb6 1px,transparent 1px),linear-gradient(90deg,#d9cfb6 1px,transparent 1px);background-size:24px 24px}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.9rem}
h2{font-size:1.45rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* header + guide */
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.guide{flex:none;width:52px;height:66px;color:var(--accent)}
.bubble{background:var(--surface);border:var(--border);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow);position:relative}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{background:var(--surface);border:var(--border);border-radius:999px;padding:4px 12px;font-size:.875rem}
.chip b{color:var(--accent)}
body[data-style="c"] .chip b{color:#3d39d6}

/* books: shared markup */
.books{list-style:none;margin:0;padding:0}
.book{display:block;width:100%;text-align:left;border:0;background:var(--cover);color:#fff}
.book .motif{width:44px;height:44px;flex:none}
.book .tag{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.book .title{font-family:var(--display);font-size:1.15rem;line-height:1.15}
.book .meta{font-size:.8125rem;opacity:.9}
.book[disabled]{--cover:#6b6f86;opacity:.6;cursor:default}

/* A: spines on a shelf */
body[data-style="a"] .books{display:flex;align-items:flex-end;gap:6px;padding:0 8px;border-bottom:14px solid #7a5230;box-shadow:0 10px 14px -6px rgba(0,0,0,.6)}
body[data-style="a"] .books li{flex:1;min-width:0}
body[data-style="a"] .book{height:270px;writing-mode:vertical-rl;display:flex;align-items:center;gap:10px;padding:14px 6px;border-radius:5px 5px 0 0;box-shadow:inset -8px 0 12px rgba(0,0,0,.28),inset 3px 0 0 rgba(255,255,255,.18)}
body[data-style="a"] li:nth-child(2) .book{height:292px}
body[data-style="a"] li:nth-child(3) .book{height:254px}
body[data-style="a"] li:nth-child(4) .book{height:236px}
body[data-style="a"] .book .motif{writing-mode:horizontal-tb;width:34px;height:34px;color:var(--accent)}
body[data-style="a"] .book .meta{display:none}
body[data-style="a"] .book .title{font-size:1.02rem}
body[data-style="a"] .shelfnote{margin-top:22px}

/* B: stops on a route */
body[data-style="b"] .books{border-left:3px dashed var(--accent);margin-left:26px;padding:6px 0 6px 0;display:flex;flex-direction:column;gap:18px}
body[data-style="b"] .book{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:12px 14px 12px 40px;position:relative;margin-left:0;transform:rotate(-.6deg)}
body[data-style="b"] li:nth-child(even) .book{transform:rotate(.7deg)}
body[data-style="b"] .book .motif{position:absolute;left:-28px;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;background:var(--cover);color:#fff;padding:9px;border:2px solid var(--ink)}
body[data-style="b"] .book .tag{color:var(--accent);font-weight:700}
body[data-style="b"] .book .title{font-size:1.35rem;display:block}
body[data-style="b"] .book[disabled] .motif{background:#9aa3b3}

/* C: cover cards */
body[data-style="c"] .books{display:grid;grid-template-columns:1fr 1fr;gap:16px}
body[data-style="c"] .book{border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;min-height:210px;display:flex;flex-direction:column;gap:8px}
body[data-style="c"] .book .motif{width:64px;height:64px;margin-bottom:auto}
body[data-style="c"] .book .title{font-size:1.3rem}
body[data-style="c"] .book .tag{background:#fff;color:#14121f;border-radius:999px;padding:2px 8px;align-self:flex-start;font-weight:700}

/* illustrated variants (day / dusk) build on C */
body[data-variant="d"]{--bg:#fdebc8;--wall:#ffcf8a;--sky:#8fd3ff;--hill:#7ccf8a;--wood:#b5703c;--wood2:#8a4f25;--floor:#e79a5b;--glow:#ffd23f}
body[data-variant="e"]{--bg:#2a2158;--surface:#3a2f7a;--ink:#fff5dc;--muted:#c9c2ee;--line:#0e0b24;--accent:#ffd23f;--border:3px solid #0e0b24;--shadow:5px 5px 0 #0e0b24;--wall:#4a3b96;--sky:#1b1c4b;--hill:#2c2a6e;--wood:#8a5530;--wood2:#553018;--floor:#33276e;--glow:#ffe27a;color-scheme:dark}
body[data-style][data-variant="e"] .chip b,body[data-style][data-variant="e"] .chapter .n{color:var(--accent)}
body[data-style][data-variant="e"] .state.done{color:#7fe0a8}
.scene{position:relative;border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;line-height:0}
.scene svg{display:block;width:100%;height:auto}
.st{stroke:#14121f;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.f-wall{fill:var(--wall)}.f-sky{fill:var(--sky)}.f-hill{fill:var(--hill)}.f-wood{fill:var(--wood)}.f-wood2{fill:var(--wood2)}.f-floor{fill:var(--floor)}.f-glow{fill:var(--glow)}
.s-wood{stroke:var(--wood);fill:none}
body[data-variant="d"] .night,body[data-variant="e"] .day{display:none}
.sign{position:absolute;left:50%;top:10px;transform:translateX(-50%) rotate(-2deg);background:#fff;color:#14121f;border:3px solid #14121f;border-radius:12px;padding:6px 14px;font-size:1.5rem;white-space:nowrap;line-height:1.15;box-shadow:3px 3px 0 #14121f}
.say{margin:-20px 12px 16px;z-index:1;font-size:.9375rem}
.rowtitle{margin:4px 0 10px}
.covers{list-style:none;margin:0 -9px;padding:4px 2px 6px;display:flex;overflow-x:auto}
.covers li{flex:none;padding:0 8px;border-bottom:14px solid var(--wood)}
.cb{position:relative;display:block;width:150px;height:210px;padding:0;border:3px solid #14121f;border-radius:8px 14px 14px 8px;overflow:hidden;background:#555;color:#fff;text-align:left;box-shadow:5px 0 0 #14121f}
.cb svg,.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.cbtag,.cbmeta{position:absolute;top:8px;border-radius:999px;padding:1px 8px;font-size:.6875rem;font-weight:700;line-height:1.5}
.cbtag{left:8px;background:#fff;color:#14121f;text-transform:uppercase;letter-spacing:.05em}
.cbmeta{right:8px;background:#14121f;color:#fff}
.cbtitle{position:absolute;left:0;right:0;bottom:0;padding:30px 10px 10px;font-family:var(--display);font-size:1.02rem;line-height:1.12;background:linear-gradient(transparent,rgba(10,8,25,.88) 48%)}
.cb[disabled]{opacity:.7;cursor:default}
.cb img,.thumb img,.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene.photo{aspect-ratio:1080/1339}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.scene .punt{position:absolute;left:50%;bottom:27%;width:17%;height:auto;transform:translateX(-50%);color:#ff5f6d;filter:drop-shadow(0 4px 4px rgba(40,20,0,.35))}
body[data-variant="d"]{--bg:#fbf1dc;--line:#4a3320;--border:2px solid #4a3320;--shadow:0 8px 18px rgba(74,51,32,.28);--accent:#c8552a;--accent-ink:#fff;--display:"Fraunces",Georgia,serif;--muted:#6b5a48;--ink:#2e2118}
body[data-style][data-variant="d"] .chip b,body[data-style][data-variant="d"] .chapter .n{color:#c8552a}
body[data-variant="d"] .sign,body[data-variant="d"] .cb,body[data-variant="d"] .thumb{border:2px solid #4a3320;box-shadow:0 6px 14px rgba(74,51,32,.35)}
body[data-variant="d"] .sign{background:#fff8e6;color:#2e2118}
body[data-variant="d"] .cta{border-color:#4a3320}
/* D: the whole site is an old, worn book */
body[data-variant="d"]{--surface:#fbf0d2;background-color:#46281a;background-image:radial-gradient(circle at 25% 0,rgba(255,200,140,.16),transparent 45%),repeating-linear-gradient(45deg,rgba(0,0,0,.08) 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px);background-attachment:fixed}
body[data-variant="d"] main{position:relative;margin:7px 6px;padding:12px 9px 14px;border-radius:5px 14px 14px 5px;background-color:#f1dfb6;
  background-image:linear-gradient(90deg,rgba(70,35,8,.42),rgba(70,35,8,.08) 22px,transparent 40px),radial-gradient(ellipse at 14% 6%,rgba(150,95,35,.3),transparent 38%),radial-gradient(ellipse at 92% 28%,rgba(140,90,30,.2),transparent 30%),radial-gradient(circle at 72% 88%,rgba(120,70,20,.26),transparent 36%),radial-gradient(circle at 18% 62%,rgba(160,110,50,.16),transparent 26%),radial-gradient(circle at 60% 48%,rgba(255,250,230,.5),transparent 40%),repeating-linear-gradient(0deg,rgba(120,80,30,.04) 0 2px,transparent 2px 5px);
  box-shadow:inset 0 0 46px rgba(110,60,15,.55),inset 0 0 7px rgba(70,35,5,.6),0 0 0 1px #24130a,0 0 0 3px #c79a45,0 0 0 5px #5d3419,0 14px 30px rgba(0,0,0,.5)}
@media (min-width:600px){body[data-variant="d"] main{margin:20px auto}}
body[data-variant="d"] main::before{content:"";position:absolute;inset:4px;border:1px solid rgba(110,65,20,.5);outline:1px solid rgba(110,65,20,.25);outline-offset:3px;border-radius:3px 9px 9px 3px;pointer-events:none}
body[data-variant="d"] .rowtitle,body[data-variant="d"] .cover h2{font-style:italic}
body[data-variant="d"] .rowtitle{color:#7a2e1a;border-bottom:1px solid rgba(110,65,20,.45);padding-bottom:4px}
body[data-variant="d"] .text p:first-child::first-letter{font-family:var(--display);font-size:3.3em;float:left;line-height:.85;padding:4px 8px 0 0;color:#a3341f}
body[data-variant="d"] .page{background-color:#fff9ea;box-shadow:inset 0 0 30px rgba(150,100,40,.22),0 6px 14px rgba(74,51,32,.3)}
img.punt{filter:drop-shadow(0 5px 5px rgba(40,20,0,.45)) drop-shadow(0 0 10px rgba(255,214,90,.75))}
.scene img.punt{position:absolute;inset:auto;left:50%;top:auto;bottom:3%;width:44%;height:auto;object-fit:contain;transform:translateX(-50%)}
.done img.punt{width:120px;height:auto;display:block;margin:0 auto 6px}
.say{display:flex;gap:10px;align-items:center}
.say img.punt{width:38px;height:auto;flex:none}
@media (prefers-reduced-motion:no-preference){
  .scene img.punt{animation:hop 2.6s ease-in-out infinite}
  @keyframes hop{0%,100%{transform:translateX(-50%) rotate(-1deg)}50%{transform:translateX(-50%) translateY(-5px) rotate(1deg)}}
}
.thumb{position:relative;flex:none;width:84px;height:118px;border:3px solid #14121f;border-radius:6px 10px 10px 6px;overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  .fly{animation:bob 5s ease-in-out infinite}.fly.b{animation-delay:-2s}.fly.c{animation-delay:-3.5s}
  .tw{animation:tw 2.4s ease-in-out infinite}.tw.b{animation-delay:-1.2s}
  @keyframes bob{50%{transform:translateY(-7px)}}
  @keyframes tw{50%{opacity:.35}}
}

/* book page */
.back{background:none;border:0;padding:8px 0;color:var(--muted);font-size:.9375rem}
.cover{background:var(--cover);color:#fff;border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow);padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:16px}
.cover .motif{width:64px;height:64px;flex:none}
.cover p{margin:6px 0 0;font-size:.9375rem}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chapter{display:flex;width:100%;align-items:center;gap:12px;text-align:left;background:var(--surface);border:var(--border);border-radius:var(--radius);padding:12px 14px}
.chapter .n{font-family:var(--display);font-size:1.3rem;width:1.6em;text-align:center;color:var(--accent)}
body[data-style="c"] .chapter .n{color:#3d39d6}
.chapter .grow{flex:1;min-width:0}
.chapter[disabled]{opacity:.5;cursor:default}
.state{font-size:.8125rem;white-space:nowrap}
.state.done{color:var(--accent);font-weight:700}
body[data-style="c"] .state.done{color:#0d7a4d}

/* reading */
.page{background:var(--page);color:var(--page-ink);border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow);padding:22px 20px}
.page h2{margin-bottom:4px}
.page .kicker{font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--page-muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0 4px;font-size:.875rem;color:var(--page-muted)}
.tools button{background:none;border:1.5px solid currentColor;border-radius:8px;min-width:40px;min-height:36px;color:var(--page-ink)}
.tools .audio{border:1.5px dashed currentColor;border-radius:999px;padding:6px 12px;margin-left:auto}
.text p{font-size:var(--read-size);line-height:1.7;margin:1em 0;max-width:65ch}
.vw{font:inherit;background:none;border:0;padding:0;color:inherit;border-bottom:2px dotted var(--bad);cursor:pointer}
.hint{font-size:.875rem;color:var(--page-muted);margin:0}
.cta{display:block;width:100%;margin-top:18px;background:var(--accent);color:var(--accent-ink);border:var(--border);border-color:transparent;border-radius:var(--radius);padding:14px 16px;font-weight:700;font-size:1.0625rem;box-shadow:var(--shadow)}
body[data-style="c"] .cta{border-color:#14121f}
details{margin-top:16px;background:var(--surface);border:var(--border);border-radius:var(--radius);padding:10px 14px;font-size:.875rem}
details summary{cursor:pointer;font-weight:700}
details dl{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
details dt{color:var(--muted)}
details dd{margin:0}

/* first-grade picture books */
.apager{touch-action:pan-y}
.album[data-g="2"] .atext{font-size:1.32rem;line-height:1.5;min-height:6em}
.aimg{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid #4a3320;background:#e6d3a8}
.atext{font-family:"Andika",var(--body);font-size:1.7rem;line-height:1.45;margin:16px 0 4px;white-space:pre-line;min-height:4.4em;text-align:center}
.album .cta,.page.big .cta{font-family:"Andika",var(--body);font-size:1.3rem}
.page.big .qtext{font-family:"Andika",var(--body);font-size:1.6rem}
.page.big .opt{font-family:"Andika",var(--body);font-size:1.45rem;padding:14px 16px}
.page.big .fb{font-family:"Andika",var(--body);font-size:1.2rem}

/* full-screen picture screens */
html,body{height:100%}
body.full{padding:0}
body.full main{margin:0 auto !important;padding:0 !important;border-radius:0 !important;box-shadow:none !important;background:#2a160c !important;container-type:inline-size;min-height:100%}
body.full main::before{display:none}
.fill{position:relative;height:100vh;height:100dvh;overflow:hidden;background:#2a160c}
.fill>.scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100cqw,calc(100dvh * var(--r)));aspect-ratio:var(--r);border:0;border-radius:0;box-shadow:none}
.fill.contain>.scene{width:min(100cqw,calc(100dvh * var(--r)))}
.fill>.blur{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(22px) brightness(.8)}
.fill>.onimg{left:12px;top:12px}
.below{padding:12px 14px 20px;background:#f1dfb6}
details.below{margin:0;border:0;border-radius:0}

/* course room and open-book screens */
.room,.openbook{position:relative}
.onimg{position:absolute;left:8px;top:8px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,248,230,.92);border:2px solid #4a3320;color:#2e2118;text-align:center;font-size:1.5rem;line-height:1}
.onshelf{list-style:none;margin:0;padding:0 10%;position:absolute;left:0;right:0;bottom:44.6%;height:20.5%;display:flex;gap:2.6%;align-items:flex-end;justify-content:center}
.onshelf li{flex:none;height:100%;aspect-ratio:.72;border:0;padding:0;position:relative;transform-origin:50% 100%}
.onshelf li:nth-child(3n+1){transform:rotate(-2.2deg)}
.onshelf li:nth-child(3n+2){transform:rotate(.8deg);height:96%}
.onshelf li:nth-child(3n){transform:rotate(2.4deg);height:98%}
.onshelf li::after{content:"";position:absolute;left:-4%;right:-10%;bottom:-3%;height:7%;background:radial-gradient(closest-side,rgba(20,8,2,.7),transparent);z-index:-1}
body[data-variant="d"] .onshelf .cb,.onshelf .cb{width:100%;height:100%;display:flex;flex-direction:column;border:0;border-radius:2px 5px 5px 2px;overflow:hidden;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.14) 5%,rgba(0,0,0,.28) 8.5%,transparent 13%,transparent 80%,rgba(0,0,0,.22)),var(--lea,#3b2a55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,225,170,.25),7px 5px 9px rgba(20,6,0,.55),2px 0 0 #e9d9b4,3px 0 0 #b9a47a,4px 0 0 #e9d9b4;text-align:center;color:#f0d48a}
.onshelf li[data-l="ca"] .cb{--lea:#5e1f1a}
.onshelf li[data-l="es"] .cb{--lea:#8a5519}
.onshelf li[data-l="en"] .cb{--lea:#40281a}
.onshelf[data-g="6"] li[data-l="ca"] .cb{--lea:#3d2466}
.onshelf[data-g="6"] li[data-l="es"] .cb{--lea:#6b2c5c}
.onshelf[data-g="6"] li[data-l="en"] .cb{--lea:#27275e}
.onshelf .cbtag{position:static;background:none;color:#e8c877;border-radius:0;padding:8.5% 0 3.5% 9%;font-size:.5rem;letter-spacing:.14em;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.6)}
.onshelf .plate{position:relative;flex:none;margin:0 9% 0 17%;height:40%;border:1px solid #d9b765;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 8px rgba(60,25,0,.5)}
.onshelf .plate::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,190,110,.28),rgba(120,40,0,.22));mix-blend-mode:multiply}
.onshelf .cbtitle{position:static;flex:1;display:flex;align-items:center;justify-content:center;background:none;padding:2% 7% 5% 15%;font-family:var(--display);font-weight:800;font-size:.86rem;line-height:1.1;text-wrap:balance}
.onshelf .cbtitle>span{display:block}
.onshelf .w{color:#fbe6a8;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.onshelf .cb::before{content:"";position:absolute;left:11.5%;right:3.5%;top:2.5%;bottom:2.5%;border:1.5px dashed rgba(255,226,160,.55);border-radius:3px;pointer-events:none}
.onshelf .star{position:absolute;right:-5%;top:-4%;z-index:2}
.onshelf .cb:active{transform:translateY(-3%)}

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function textHtml(ch){
  const paras = ch.paragraphs.map(esc);
  ch.vocab.forEach((v, i) => {
    const w = esc(v.w);
    for (let p = 0; p < paras.length; p++){
      const at = paras[p].indexOf(w);
      if (at > -1){ paras[p] = paras[p].slice(0, at) + `<button type="button" class="vw" data-act="word" data-i="${i}">${w}</button>` + paras[p].slice(at + w.length); break; }
    }
  });
  return paras.map(p => `<p>${p}</p>`).join("");
}

/* ---------- pages: the chapter flows into columns, one column per page ---------- */
const GAP = 48;
function layoutPager(){
  const pager = document.getElementById("pager"), flow = document.getElementById("flow");
  if (!pager || !flow) return;
  const top = pager.getBoundingClientRect().top + window.scrollY;
  const H = Math.max(300, Math.min(760, window.innerHeight - top - 12 - 64));
  const W = pager.clientWidth;
  pager.style.height = flow.style.height = H + "px";
  flow.style.columnWidth = W + "px"; flow.style.columnGap = GAP + "px";
  view.w = W;
  view.pages = Math.max(1, Math.round((flow.scrollWidth + GAP) / (W + GAP)));
  view.p = Math.min(view.p || 0, view.pages - 1);
  showPage();
}
function showPage(){
  const album = book(view.id).chapters.find(c => c.n === view.n).pages;
  if (album){
    const pg = album[view.p], tt = UI[book(view.id).lang], im = document.getElementById("aimg");
    const bk = book(view.id);
    im.onerror = () => { im.onerror = null; im.src = "data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${bk.cover}'/><stop offset='1' stop-color='#fbe6a8'/></linearGradient></defs><rect width='400' height='300' fill='url(#g)'/>${pg.e ? `<text x='200' y='185' font-size='150' text-anchor='middle'>${pg.e}</text>` : `<text x='200' y='160' font-size='22' text-anchor='middle' fill='#fff' font-family='sans-serif'>Il·lustració aviat</text>`}</svg>`); };
    im.src = pg.img; im.alt = pg.alt;
    document.getElementById("atext").textContent = pg.t;
    document.getElementById("pnum").textContent = `${view.p + 1} ${tt.of} ${album.length}`;
    document.getElementById("toquiz").hidden = view.p !== album.length - 1;
    document.getElementById("aprev").disabled = view.p === 0;
    document.getElementById("anext").disabled = view.p === album.length - 1;
    const pgr = document.getElementById("pager"), dir = view.dir || 0; view.dir = 0;
    pgr.classList.remove("in-l", "in-r");
    if (dir){ void pgr.offsetWidth; pgr.classList.add(dir > 0 ? "in-r" : "in-l"); }
    if (album[view.p + 1]) new Image().src = album[view.p + 1].img;
    return;
  }
  const flow = document.getElementById("flow"); if (!flow) return;
  const t = UI[book(view.id).lang], last = view.p === view.pages - 1;
  flow.style.transform = `translateX(${-view.p * (view.w + GAP)}px)`;
  document.getElementById("pnum").textContent = `${view.p + 1} ${t.of} ${view.pages}`;
  document.getElementById("toquiz").hidden = !last;
  hideTip();
}
function turn(d){
  if (view.name !== "read") return;
  stopTalk();
  const n = Math.max(0, Math.min(view.pages - 1, view.p + d));
  if (n !== view.p){ view.dir = d; view.p = n; showPage(); }
}
function hideTip(){ const tip = document.getElementById("tip"); if (tip) tip.hidden = true; }
function showTip(i, el){
  const v = book(view.id).chapters.find(c => c.n === view.n).vocab[i];
  const tip = document.getElementById("tip"), art = tip.parentElement.getBoundingClientRect(), r = el.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(v.w)}</b>${esc(v.def)}`;
  tip.hidden = false; tip.classList.remove("below");
  const tw = tip.offsetWidth, mid = r.left + r.width / 2 - art.left;
  const left = Math.max(8, Math.min(art.width - tw - 8, mid - tw / 2));
  let top = r.top - art.top - tip.offsetHeight - 10;
  if (top < 4){ top = r.bottom - art.top + 10; tip.classList.add("below"); }
  tip.style.left = left + "px"; tip.style.top = top + "px";
  tip.style.setProperty("--ax", Math.max(14, Math.min(tw - 14, mid - left)) + "px");
}
let touch = null;
document.addEventListener("touchstart", e => { if (e.target.closest("#pager, #swipe")) touch = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
document.addEventListener("touchend", e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y; touch = null;
  if (!(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5)) return;
  if (view.name === "home") go({name:"courses"});
  else if (view.name === "courses") go({name:"home"});
  else turn(dx < 0 ? 1 : -1);
}, {passive:true});
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") turn(1); else if (e.key === "ArrowLeft") turn(-1); });
window.addEventListener("resize", () => { if (view.name === "read") layoutPager(); });

function quizView(b, ch){

  const solved = ch.questions.length - z.queue.length - (z.answered && z.answered.ok ? 0 : 1);

  const opts = z.order.map(i => {
    const o = q.options[i]; let cls = "opt";
    if (z.answered && z.answered.i === i) cls += o.ok ? " ok" : " bad";
    return `<button type="button" class="${cls}" data-act="answer" data-i="${i}" ${z.answered ? "disabled" : ""}>${esc(o.t)}</button>`;
  }).join("");

  if (z.answered){
    const o = q.options[z.answered.i];
    fb = `<div class="fb ${o.ok ? "" : "bad"}" role="status"><strong>${o.ok ? t.right : t.wrong}</strong>${esc(o.why)}${o.ok ? "" : `<span class="again">${t.again}</span>`}</div><button type="button" class="cta" data-act="next">${t.next}</button>`;
  }
  return `
  <button type="button" class="back${b.album ? " arrow" : ""}" data-act="read" data-id="${b.id}" data-n="${ch.n}"${b.album ? ` aria-label="${t.back}"` : ""}>←${b.album ? "" : ` ${t.chapter} ${ch.n}`}</button>
  <section class="page${b.album ? " big" : ""}" lang="${b.lang}">
    <div class="dots" aria-hidden="true">${dots}</div>
    ${b.album ? "" : `<span class="badge">${t.types[q.type]}</span>`}
    ${q.quote ? `<p class="quote">${esc(q.quote)}</p>` : ""}
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${fb}
  </section>`;
}

/* ---------- listen: the device's own voice for now. Later, say() can play an mp3 from a manifest instead ---------- */
const synth = window.speechSynthesis; let talk = null;
const LISTEN = {ca:"Escolta la pàgina", es:"Escuchar la página", en:"Listen to the page"};
const LCODE = {ca:"ca-ES", es:"es-ES", en:"en-GB"};
const NOVOICE = {ca:"Aquest dispositiu no té veu en català.", es:"Este dispositivo no tiene voz en castellano.", en:"This device has no English voice."};
function pickVoice(lang){
  const norm = v => v.lang.replace("_", "-");
  const score = v => (norm(v) === LCODE[lang] ? 2 : 0) + (/enhanced|premium|natural|neural|google/i.test(v.name) ? 3 : 0);
  return synth.getVoices().filter(v => norm(v).toLowerCase().startsWith(lang)).sort((a, b) => score(b) - score(a))[0] || null;
}
function stopTalk(){
  if (!talk) return;
  if (talk.a) talk.a.pause();
  talk = null; if (synth) synth.cancel();
  if (window.CSS && CSS.highlights) CSS.highlights.delete("say");
  const bt = document.getElementById("listen"); if (bt) bt.setAttribute("aria-pressed", "false");
}
/* mp3 voices (made by the GitHub workflow) when the page has one; otherwise the device's own voice */
let AUDIO = {}; const player = new Audio();
fetch("audio/manifest.json").then(r => r.ok ? r.json() : {}).then(m => { AUDIO = m || {}; }).catch(() => {});
function say(text, lang, slow, done, key){
  const T = talk;
  if (key && AUDIO[key]){
    T.a = player; player.onended = () => { if (talk === T) done(); };
    player.onerror = () => { if (talk === T){ T.a = null; deviceSay(text, lang, slow, done); } };
    player.src = AUDIO[key].f; player.play().catch(() => { if (talk === T){ T.a = null; deviceSay(text, lang, slow, done); } });
    return;
  }
  deviceSay(text, lang, slow, done);
}
function deviceSay(text, lang, slow, done){
  if (!synth) return stopTalk();
  const T = talk, u = new SpeechSynthesisUtterance(text), v = pickVoice(lang);
  u.lang = v ? v.lang : LCODE[lang]; if (v) u.voice = v; u.rate = slow ? .8 : .95;
  u.onend = () => { if (talk === T) done(); };
  u.onerror = () => { if (talk === T) stopTalk(); };
  T.u = u; synth.speak(u);
}
function sentences(){
  const out = [];
  document.querySelectorAll("#flow h2, #flow .text p").forEach(el => {
    const re = /.+?(?:[.!?…]+["»”')\]]*(?=\s|$)|$)/gs; let m;
    while ((m = re.exec(el.textContent))){ const lead = m[0].length - m[0].trimStart().length; if (m[0].trim()) out.push({el, a:m.index + lead, b:m.index + m[0].length, t:m[0].trim()}); }
  });
  return out;
}
function rangeOf(u){
  const r = document.createRange(), w = document.createTreeWalker(u.el, NodeFilter.SHOW_TEXT); let n, pos = 0, open = false;

    return `<button type="button" class="pcard${up ? " up" : ""}${z.done[i] ? " ok" : ""}${c.w ? " w" : ""}" data-act="ptap" data-i="${i}" ${up ? "disabled" : ""}>${up ? esc(c.t) : "?"}</button>`; }).join("");
  return `
  <button type="button" class="back arrow" data-act="games" data-g="${view.g}" aria-label="${t.back}"><svg viewBox="0 0 84 60" aria-hidden="true"><path d="M6 30 L32 6 V21 H78 V39 H32 V54 Z"/></svg></button>
  <section class="page" lang="${z.lang}">
    <h2 class="qtext">${t.pairs}</h2><p class="muted">${t.pp} · ${z.moves} ${t.moves}</p>
    <div class="pgrid">${cards}</div>
  </section>`;
}
function pairsDoneView(){
  const z = view.pr, t = GM[z.lang];
  return `
  <section class="page done" lang="${z.lang}">
    <img class="punt" src="img/punt.png" alt="">
    <h2>${t.done}</h2>
    <p class="score">${z.moves}</p><p>${t.moves}</p>
    <button type="button" class="cta" data-act="pairs" data-g="${view.g}">${t.again}</button>
    <button type="button" class="cta" data-act="games" data-g="${view.g}">${t.back}</button>
  </section>`;
}

/* ---------- games hub, by course and language ---------- */
const TX = {
  ca:{yes:"Sí", no:"No", tfq:"Aquesta resposta és correcta?", next:"Següent", right:"Correcte!", wrong:"No és correcte.", again:"Una altra tanda", back:"Tornar als jocs", done:"Fet!", first:"a la primera", bl:"Ordena les lletres", bw:"Ordena la frase", tf:"Veritat o mentida", clear:"Esborra"},
  es:{yes:"Sí", no:"No", tfq:"¿Es correcta esta respuesta?", next:"Siguiente", right:"¡Correcto!", wrong:"No es correcto.", again:"Otra tanda", back:"Volver a los juegos", done:"¡Hecho!", first:"a la primera", bl:"Ordena las letras", bw:"Ordena la frase", tf:"Verdad o mentira", clear:"Borrar"},
  en:{yes:"Yes", no:"No", tfq:"Is this answer correct?", next:"Next", right:"Correct!", wrong:"That's not correct.", again:"Another round", back:"Back to the games", done:"Done!", first:"first try", bl:"Put the letters in order", bw:"Put the sentence in order", tf:"True or false", clear:"Clear"}
};
function sentPool(g){
  const out = [], mx = g === 1 ? 6 : g === 2 ? 8 : 10;
  BOOKS.filter(b => gradeOf(b) === g && (SEL.l === "all" || b.lang === SEL.l)).forEach(b => b.chapters.forEach(ch => {
    const texts = ch.pages ? ch.pages.map(p => p.t) : ch.paragraphs;
    texts.forEach(t => t.split(/(?<=[.!?])\s+/).forEach(sn => { sn = sn.replace(/^[—«"\s-]+|[»"\s]+$/g, "").replace(/\n/g, " ");
      const w = sn.split(/\s+/); if (w.length >= 4 && w.length <= mx && /[.!?]$/.test(sn)) out.push({b, sn, w}); })); }));
  return out;
}
function letterPool(g){
  const mx = g <= 2 ? 6 : g <= 3 ? 7 : 9, seen = {};
  return wordPool(g).filter(x => { const w = WN(x.v.w); if (!/^[\p{L}]+$/u.test(w) || w.length < 4 || w.length > mx) return false; const k = x.b.lang + w.toLowerCase(); if (seen[k]) return false; seen[k] = 1; return true; });
}
function tfPool(g){
  const out = [];
  BOOKS.filter(b => gradeOf(b) === g && (SEL.l === "all" || b.lang === SEL.l)).forEach(b => b.chapters.forEach(ch => (ch.questions || []).forEach(q => { if (q.options.length >= 2) out.push({b, q}); })));
  return out;
}
const GAMES = [
  {id:"bl", min:1, max:4, ic:"🔤", t:"Lletres desordenades", d:"Posa les lletres en ordre i forma la paraula.", can:g => letterPool(g).length >= 4},
  {id:"bw", min:1, max:3, ic:"🧩", t:"Ordena la frase", d:"Posa les paraules en ordre per poder llegir la frase.", can:g => sentPool(g).length >= 4},
  {id:"pairs", min:1, max:6, ic:"🃏", t:"Parelles de paraules", d:"Troba cada paraula amb el seu significat.", can:g => pairsPool(g).length > 0},
  {id:"words", min:2, max:6, ic:"📖", t:"Joc de paraules", d:"Llegeix el significat i tria la paraula.", can:g => wordPool(g).length >= 6},
  {id:"cloze", min:2, max:6, ic:"✏️", t:"Completa la frase", d:"Tria la paraula que falta a la frase d'un llibre.", can:g => clozePool(g).length >= 4 && wordPool(g).length >= 4},
  {id:"tf", min:3, max:6, ic:"✅", t:"Veritat o mentida", d:"Decideix si la resposta a la pregunta és correcta.", can:g => tfPool(g).length >= 4},
  {id:"order", min:3, max:6, ic:"📚", t:"Ordena la història", d:"Posa en ordre els trossos d'una història.", can:g => orderPool(g).length > 0}
];
function gamesView(g, l){
  SEL.g = g; SEL.l = l; const age = GRADES[g - 1][1];
  const list = GAMES.filter(x => g >= x.min && g <= x.max);
  const cards = list.map(x => { const ok = x.can(g);
    return `<button type="button" class="gcard" data-act="play" data-game="${x.id}" ${ok ? "" : "disabled"}><span class="gic">${x.ic}</span><span><b>${x.t}</b><br><small>${ok ? x.d : "Encara no hi ha prou llibres en aquest idioma."}</small></span></button>`; }).join("");
  const lname = l === "all" ? "Tots els idiomes" : (LANGS.find(x => x[0] === l) || [, l])[1];
  return `
  <div class="fill contain" style="--r:${572/1024}">
    <div class="scene dicscene">
      <img src="img/jocs-fons.jpg" alt="">
      <div class="dscroll gscroll" tabindex="0">${cards}</div>
      <div class="dinfo" style="top:86.4%">${age} · ${lname}</div>
    </div>
    <button type="button" class="back arrow onimg" data-act="tolang" data-mode="games" aria-label="Enrere"><svg viewBox="0 0 84 60" aria-hidden="true"><path d="M6 30 L32 6 V21 H78 V39 H32 V54 Z"/></svg></button>
  </div>`;
}
function play(id){
  const g = SEL.g;
  if (id === "words") startWords(g); else if (id === "cloze") startCloze(g); else if (id === "pairs") startPairs(g); else if (id === "order") startOrder(g);
  else if (id === "bl" || id === "bw") startBuild(id, g); else if (id === "tf") startTF(g);
}
function gdone(lang, score, total, game){ view = {name:"gdone", g:SEL.g, gd:{lang, score, total, game}}; render(); window.scrollTo(0, 0); }
function gdoneView(){
  const z = view.gd, t = TX[z.lang];
  return `
  <section class="page done" lang="${z.lang}">
    <img class="punt" src="img/punt.png" alt="">
    <h2>${t.done}</h2><p class="score">${z.score} / ${z.total}</p><p>${t.first}</p>
    <button type="button" class="cta" data-act="play" data-game="${z.game}">${t.again}</button>
    <button type="button" class="cta" data-act="games" data-g="${view.g}">${t.back}</button>
  </section>`;
}
/* build: letters of a word or words of a sentence, tapped in order */
function startBuild(kind, g){
  let items = [];
  if (kind === "bl"){ shuffle(letterPool(g)).slice(0, 6).forEach(x => { const w = WN(x.v.w); items.push({b:x.b, prompt:x.v.def, tokens:[...w], join:""}); }); }
  else { const seen = {}; shuffle(sentPool(g)).forEach(x => { if (items.length >= 5 || seen[x.sn]) return; seen[x.sn] = 1; items.push({b:x.b, prompt:x.b.title, tokens:x.w, join:" "}); }); }
  if (!items.length) return;
  items.forEach(it => { let tiles; let tries = 0; do { tiles = shuffle(it.tokens.map((t, k) => ({t, k}))); tries++; } while (tries < 6 && tiles.every((x, i) => x.k === i)); it.tiles = tiles; it.used = {}; });
  view = {name:"build", g, bd:{kind, items, i:0, pos:0, miss:0, clean:0, flash:-1}}; render(); window.scrollTo(0, 0);
}
function buildTap(ix){
  const z = view.bd, it = z.items[z.i]; if (it.used[ix]) return;
  if (it.tiles[ix].t === it.tokens[z.pos]){ it.used[ix] = true; z.pos++; z.flash = -1; } else { z.miss++; z.flash = ix; }
  render();
}
function buildNext(){
  const z = view.bd; if (z.miss === 0) z.clean++;
  z.i++; z.pos = 0; z.miss = 0; z.flash = -1;
  if (z.i >= z.items.length) gdone(z.items[0].b.lang, z.clean, z.items.length, z.kind); else { render(); window.scrollTo(0, 0); }
}
function buildView(){
  const z = view.bd, it = z.items[z.i], t = TX[it.b.lang], fin = z.pos >= it.tokens.length;
  const built = it.tokens.slice(0, z.pos).join(it.join);
  const tiles = it.tiles.map((x, i) => `<button type="button" class="tile${it.used[i] ? " used" : ""}${z.flash === i ? " bad" : ""}" data-act="btap" data-i="${i}" ${it.used[i] ? "disabled" : ""}>${esc(x.t)}</button>`).join("");
  return `
  <button type="button" class="back arrow" data-act="games" data-g="${view.g}" aria-label="${t.back}">${ARR}</button>
  <section class="page" lang="${it.b.lang}">
    <div class="dots" aria-hidden="true">${z.items.map((_, k) => `<i class="${k < z.i ? "on" : ""}"></i>`).join("")}</div>
    <span class="badge">${esc(z.kind === "bl" ? t.bl : t.bw)}</span>
    <p class="qtext">${esc(it.prompt)}</p>
    <div class="built" aria-live="polite">${esc(built) || "&nbsp;"}</div>
    <div class="tiles">${tiles}</div>
    ${fin ? `<div class="fb" role="status"><strong>${t.right}</strong></div><button type="button" class="cta" data-act="bnext">${t.next}</button>` : ""}
  </section>`;
}
/* true or false about a comprehension question */
function startTF(g){
  const pool = shuffle(tfPool(g)), items = [];
  for (const x of pool){ if (items.length >= 8) break; const okOpt = x.q.options.find(o => o.ok), bad = shuffle(x.q.options.filter(o => !o.ok))[0]; if (!okOpt || !bad) continue;
    const truth = Math.random() < .5; items.push({b:x.b, q:x.q.q, a:truth ? okOpt.t : bad.t, truth, why:(truth ? okOpt : bad).why, right:okOpt.t}); }
  if (items.length < 4) return;
  view = {name:"tf", g, tf:{items, i:0, first:0, answered:null}}; render(); window.scrollTo(0, 0);
}
function tfAnswer(v){ const z = view.tf, it = z.items[z.i]; if (z.answered) return; z.answered = {v, ok:v === it.truth}; if (z.answered.ok) z.first++; render(); }
function tfNext(){ const z = view.tf; z.i++; z.answered = null; if (z.i >= z.items.length) gdone(z.items[0].b.lang, z.first, z.items.length, "tf"); else { render(); window.scrollTo(0, 0); } }
function tfView(){
  const z = view.tf, it = z.items[z.i], t = TX[it.b.lang], an = z.answered;
  let fb = "";
  if (an) fb = `<div class="fb ${an.ok ? "" : "bad"}" role="status"><strong>${an.ok ? t.right : t.wrong}</strong>${esc(it.why)}${an.ok || it.truth ? "" : ` <em>${esc(it.right)}</em>`}</div><button type="button" class="cta" data-act="tfnext">${t.next}</button>`;
  return `
  <button type="button" class="back arrow" data-act="games" data-g="${view.g}" aria-label="${t.back}">${ARR}</button>
  <section class="page" lang="${it.b.lang}">
    <div class="dots" aria-hidden="true">${z.items.map((_, k) => `<i class="${k < z.i ? "on" : ""}"></i>`).join("")}</div>
    <span class="badge">${esc(it.b.title)}</span>
    <p class="qtext">${esc(it.q)}</p>
    <p class="tfans">${esc(it.a)}</p><p class="muted">${t.tfq}</p>
    <div class="opts tf"><button type="button" class="opt${an && an.v === true ? (an.ok ? " ok" : " bad") : ""}" data-act="tfa" data-v="1" ${an ? "disabled" : ""}>✓ ${t.yes}</button><button type="button" class="opt${an && an.v === false ? (an.ok ? " ok" : " bad") : ""}" data-act="tfa" data-v="0" ${an ? "disabled" : ""}>✗ ${t.no}</button></div>
    ${fb}
  </section>`;
}

/* ---------- course + language pickers for dictionary and games ---------- */
const PKH = [[17.1,21,31.5,20],[54.7,21,30.6,20],[15,41.8,33.6,20.7],[55.2,41.8,32.5,20.7],[10.8,63.7,36.7,23.2],[55.6,63.7,38.1,23.2]];
function pickView(mode){
  return `
  <div class="fill contain" style="--r:${572/1024}">
    <div class="scene pkscene">
      <img src="img/pick-curs.jpg" alt="Sis llibres sobre una taula, un per cada curs, de l'1 al 6.">
      ${PKH.map(([l, t, w, h], i) => `<button type="button" class="pk" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%" data-act="pickg" data-g="${i + 1}" data-mode="${mode}" aria-label="${GRADES[i][1]}"></button>`).join("")}
      <div class="pkmode">${mode === "dict" ? "📖 Diccionari" : "🧩 Jocs de lectura"}</div>
    </div>
    <button type="button" class="back arrow onimg" data-act="courses" aria-label="Enrere"><svg viewBox="0 0 84 60" aria-hidden="true"><path d="M6 30 L32 6 V21 H78 V39 H32 V54 Z"/></svg></button>
  </div>`;
}
const LBH = [["ca","Català",17.1,21,31.5,20],["es","Castellano",54.7,21,30.6,20],["en","English",31.5,47.3,36.2,22.9]];
function langView(mode, g){
  const age = GRADES[g - 1][1];
  return `
  <div class="fill contain" style="--r:${572/1024}">
    <div class="scene pkscene">
      <img src="img/pick-idioma.jpg" alt="Tres llibres sobre una taula: català, castellà i anglès.">
      ${LBH.map(([l, n, x, y, w, h]) => `<button type="button" class="pk" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%" data-act="pickl" data-mode="${mode}" data-g="${g}" data-l="${l}" aria-label="${n}"></button>`).join("")}
      <button type="button" class="pkall" data-act="pickl" data-mode="${mode}" data-g="${g}" data-l="all">Tots els idiomes</button>
      <div class="pkmode">${age} · ${mode === "dict" ? "📖 Diccionari" : "🧩 Jocs de lectura"}</div>
    </div>
    <button type="button" class="back arrow onimg" data-act="pickback" data-mode="${mode}" aria-label="Enrere"><svg viewBox="0 0 84 60" aria-hidden="true"><path d="M6 30 L32 6 V21 H78 V39 H32 V54 Z"/></svg></button>
  </div>`;
}
function openMode(mode, g, l){ SEL.g = g; SEL.l = l; go({name:mode === "dict" ? "dict" : "games", g, l}); }

function render(){
  stopTalk();
  closeSheet();
  const b = view.id && book(view.id), ch = b && view.n && b.chapters.find(c => c.n === view.n);
  app.innerHTML = view.name === "pick" ? pickView(view.mode) : view.name === "lang" ? langView(view.mode, view.g) : view.name === "gdone" ? gdoneView() : view.name === "build" ? buildView() : view.name === "tf" ? tfView() : view.name === "games" ? gamesView(view.g, view.l || "all") : view.name === "pairs" ? pairsView() : view.name === "pdone" ? pairsDoneView() : view.name === "order" ? orderView() : view.name === "odone" ? orderDoneView() : view.name === "words" ? wordsView() : view.name === "wdone" ? wDoneView() : view.name === "dict" ? dictView(view.g, view.l || "all") : view.name === "reinforce" ? rfView() : view.name === "rfdone" ? rfDoneView() : view.name === "home" ? home() : view.name === "courses" ? coursesView() : view.name === "shelf" ? shelfView(view.g) : view.name === "book" ? bookView(b) : view.name === "read" ? readView(b, ch) : view.name === "quiz" ? quizView(b, ch) : doneView(b, ch);
  document.documentElement.lang = b ? b.lang : "ca";
  document.body.classList.toggle("full", ["home","courses","shelf","book"].includes(view.name));
  document.body.classList.toggle("alb", view.name === "read" && !!(ch && ch.pages));
  if (view.name === "read" && ch.pages){ view.pages = ch.pages.length; view.p = Math.min(view.p || 0, view.pages - 1); showPage(); }
  else if (view.name === "read"){ layoutPager(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutPager); }
  if (view.name === "dict") dictAfter();
}
window.addEventListener("resize", () => { if (view.name === "dict") { clearTimeout(window._rz); window._rz = setTimeout(render, 150); } });
function go(v){ view = v; render(); window.scrollTo(0, 0); }

/* ---------- quiz logic: a wrong answer sends the question back to the queue ---------- */
function startQuiz(){
  const ch = book(view.id).chapters.find(c => c.n === view.n);
  const queue = ch.questions.map((_, i) => i);
  view = {name:"quiz", id:view.id, n:view.n, quiz:{queue, cur:null, order:[], answered:null, first:0, seen:{}}};
  nextQuestion();
}
function nextQuestion(){
  const z = view.quiz, b = book(view.id), ch = b.chapters.find(c => c.n === view.n);
  if (!z.queue.length){
    saved.done[b.id] = Array.from(new Set([...(saved.done[b.id] || []), ch.n])); save();
    view.name = "done"; render(); window.scrollTo(0, 0); return;
  }
  z.cur = z.queue.shift(); z.answered = null;
  z.order = shuffle(ch.questions[z.cur].options.map((_, i) => i));
  render(); window.scrollTo(0, 0);
}
function answer(i){
  const z = view.quiz, ch = book(view.id).chapters.find(c => c.n === view.n), q = ch.questions[z.cur];
  const ok = !!q.options[i].ok;
  z.answered = {i, ok};
  if (ok){ if (!z.seen[z.cur]){ z.first++; saved.hit[q.type] = (saved.hit[q.type] || 0) + 1; save(); } }
  else { z.queue.push(z.cur); saved.miss[q.type] = (saved.miss[q.type] || 0) + 1; save(); }
  z.seen[z.cur] = true;
  render();
}

/* ---------- vocabulary sheet ---------- */
const sheet = document.getElementById("sheet");
function closeSheet(){ sheet.hidden = true; }
function showWord(i){
  const v = book(view.id).chapters.find(c => c.n === view.n).vocab[i];
  document.getElementById("sheetText").innerHTML = `<b>${esc(v.w)}</b><br>${esc(v.def)}`;
  sheet.lang = book(view.id).lang; sheet.hidden = false;
}

document.addEventListener("click", e => {
  const s = e.target.closest("[data-style-btn]");
  if (s){ saved.style = s.dataset.styleBtn; save(); applyStyle(); return; }
  const el = e.target.closest("[data-act]");
  if (!el){
    const pg = e.target.closest("#pager");
    const tipOpen = document.getElementById("tip") && !document.getElementById("tip").hidden;
    hideTip();
    if (pg && !tipOpen){ const r = pg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width; if (x > .7) turn(1); else if (x < .3) turn(-1); }
    return;
  }
  const a = el.dataset.act;
  if (a === "home"){ const cur = view.id && book(view.id); go(cur ? {name:"shelf", g:gradeOf(cur)} : {name:"home"}); }
  else if (a === "cover") go({name:"home"});
  else if (a === "courses") go({name:"courses"});
  else if (a === "shelf") go({name:"shelf", g:+el.dataset.g});
  else if (a === "book") go({name:"book", id:el.dataset.id});
  else if (a === "read") go({name:"read", id:el.dataset.id, n:+el.dataset.n});
  else if (a === "listen") toggleTalk();
  else if (a === "quiz") startQuiz();
  else if (a === "rf") startReinforce(+el.dataset.g);
  else if (a === "dict") go({name:"dict", g:+el.dataset.g, l:SEL.l});
  else if (a === "words") startWords(+el.dataset.g);
  else if (a === "dictH" || a === "gamesH"){ const m = a === "dictH" ? "dict" : "games"; el.dataset.g ? go({name:"lang", mode:m, g:+el.dataset.g}) : go({name:"pick", mode:m}); }
  else if (a === "games") go({name:"games", g:+el.dataset.g || SEL.g, l:SEL.l});
  else if (a === "pickg") go({name:"lang", mode:el.dataset.mode, g:+el.dataset.g});
  else if (a === "pickl") openMode(el.dataset.mode, +el.dataset.g, el.dataset.l);
  else if (a === "pickback") go({name:"pick", mode:el.dataset.mode});
  else if (a === "tolang") go({name:"lang", mode:el.dataset.mode, g:SEL.g});
  else if (a === "dictg") go({name:"dict", g:+el.dataset.v, l:SEL.l});
  else if (a === "dgo"){ const t = document.getElementById("dL-" + el.dataset.c); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if (a === "gamesg") go({name:"games", g:+el.dataset.v, l:SEL.l});
  else if (a === "gamesl") go({name:"games", g:SEL.g, l:el.dataset.v});
  else if (a === "play") play(el.dataset.game);
  else if (a === "btap") buildTap(+el.dataset.i);
  else if (a === "bnext") buildNext();
  else if (a === "tfa") tfAnswer(el.dataset.v === "1");
  else if (a === "tfnext") tfNext();
  else if (a === "cloze") startCloze(+el.dataset.g);
  else if (a === "pairs") startPairs(+el.dataset.g);
  else if (a === "ptap") pairsTap(+el.dataset.i);
  else if (a === "order") startOrder(+el.dataset.g);
  else if (a === "opick") orderPick(+el.dataset.i);
  else if (a === "onext") orderNext();
  else if (a === "wanswer") wAnswer(+el.dataset.i);
  else if (a === "wnext") wNext();
  else if (a === "rfanswer") rfAnswer(+el.dataset.i);
  else if (a === "rfnext") rfNext();
  else if (a === "answer") answer(+el.dataset.i);
  else if (a === "next") nextQuestion();
  else if (a === "word") showTip(+el.dataset.i, el);
  else if (a === "prevp") turn(-1);
  else if (a === "nextp") turn(1);
  else if (a === "closeSheet") closeSheet();
  else if (a === "size"){ saved.size = Math.max(0, Math.min(SIZES.length - 1, saved.size + (+el.dataset.d))); save(); applyStyle(); }
});

applyStyle(); render();
</script>
